# .vibesec-custom.yaml — example policy using only custom inline rules (no presets)
# Rename to .vibesec.yaml at your workspace root to use it.

severity:
  minSeverity: info

rules:
  - id: my-team.no-print-statements
    message: "Remove debug print() calls before shipping to production."
    severity: WARNING
    languages: [python]
    pattern: print(...)
    metadata:
      category: maintainability

  - id: my-team.no-hardcoded-localhost
    message: "Hardcoded localhost URL detected. Use a config variable instead."
    severity: WARNING
    languages: [python, javascript, typescript]
    pattern: "\"http://localhost\""
    metadata:
      category: configuration
