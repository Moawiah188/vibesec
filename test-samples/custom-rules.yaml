# custom-rules.yaml — example external rule file
# Reference this from .vibesec.yaml via externalRuleFiles:
#   - test-samples/custom-rules.yaml

rules:
  - id: my-team.hardcoded-jwt-secret
    message: "Hardcoded JWT secret detected. Move this to an environment variable."
    severity: ERROR
    languages: [python, javascript, typescript]
    patterns:
      - pattern: jwt.encode(..., "$SECRET", ...)
    metadata:
      category: security
      cwe: "CWE-798"

  - id: my-team.raw-sql-format
    message: "SQL query built with string formatting — potential SQL injection."
    severity: ERROR
    languages: [python]
    patterns:
      - pattern: cursor.execute("..." % ...)
      - pattern: cursor.execute(f"...")
    metadata:
      category: security
      cwe: "CWE-89"

  - id: my-team.insecure-random-token
    message: "random.random() is not cryptographically secure. Use secrets.token_hex() instead."
    severity: WARNING
    languages: [python]
    pattern: random.random()
    metadata:
      category: security
      cwe: "CWE-330"
